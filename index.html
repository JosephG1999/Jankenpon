<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Rock Paper Scissors</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>ROCK, PAPER, SCISSORS!</h1>
        <button onclick="gameFunction('rock')">ROCK</button>
        <button onclick="gameFunction('paper')">PAPER</button>
        <button onclick="gameFunction('scissors')">SCISSORS</button>
        <script>
            const score = {
                wins: 0,
                losses: 0,
                ties: 0
            }

            function versusFunction()
            {
                let randomNumber = Math.floor(Math.random() * 3);
                if (randomNumber == 0)
                {
                    return "rock";
                }
                else if (randomNumber == 1)
                {
                    return "paper";
                }
                else if (randomNumber == 2)
                {
                    return "scissors";
                }
            }
            function gameFunction(playerChoice)
            {
                let result;
                let computerChoice = versusFunction();
                if (playerChoice == "rock")
                {
                    if (computerChoice == "rock") {result = "tie!";}
                    else if (computerChoice == "paper") {result = "lose!";}
                    else if (computerChoice == "scissors"){result = "win!";}
                }
                else if (playerChoice == "paper")
                {
                    if (computerChoice == "rock") {result = "win!";}
                    else if (computerChoice == "paper") {result = "tie!";}
                    else if (computerChoice == "scissors") {result = "lose!";}
                }
                else if (playerChoice == "scissors")
                {
                    if (computerChoice == "rock") {result = "lose!";}
                    else if (computerChoice == "paper") {result = "win!";}
                    else if (computerChoice == "scissors") {result = "tie!";}
                }

                if (result == "win!") {score.wins++;}
                else if (result == "lose!") {score.losses++;}
                else if (result == "tie!") {score.ties++;}

                alert(`You chose ${playerChoice}.` + "\n" + `The computer chose ${computerChoice}.` + "\n" + `You ${result}`
                + "\n" + `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
            }
        </script>
    </body>
</html>
